<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#05070b" />
  <meta name="description" content="AI Radio – thousands of free worldwide internet radio stations" />
  <title>AI Radio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05070b;
      --panel: #0b0f17;
      --card: #121722;
      --elevated: #1a2130;
      --accent: #7cfc00;
      --accent-dim: #5cb800;
      --cyan: #00ffcc;
      --purple: #b388ff;
      --text: #eef0f4;
      --muted: #8b939e;
      --border: #1e2533;
      --danger: #ff5252;
      --glow: rgba(124, 252, 0, 0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 10px;
      background-image:
        radial-gradient(ellipse 80% 50% at 15% -10%, rgba(124,252,0,0.09), transparent),
        radial-gradient(ellipse 60% 40% at 90% 110%, rgba(179,136,255,0.07), transparent);
    }
    .app {
      width: 100%;
      max-width: 540px;
      background: var(--panel);
      border-radius: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 30px 60px -20px rgba(0,0,0,0.85), 0 0 0 1px rgba(255,255,255,0.03);
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 20px);
      overflow: hidden;
    }

    /* ===== HEADER ===== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: linear-gradient(180deg, rgba(124,252,0,0.04), transparent);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .alien {
      width: 50px; height: 50px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #1f3a22, #0a140c);
      border: 2px solid var(--accent);
      box-shadow: 0 0 22px var(--glow), inset 0 0 14px rgba(124,252,0,0.12);
      display: flex; align-items: center; justify-content: center;
      position: relative;
      animation: alienPulse 3.5s ease-in-out infinite;
    }
    @keyframes alienPulse {
      0%, 100% { box-shadow: 0 0 18px var(--glow), inset 0 0 12px rgba(124,252,0,0.1); }
      50% { box-shadow: 0 0 28px rgba(124,252,0,0.55), inset 0 0 16px rgba(124,252,0,0.18); }
    }
    .alien svg { width: 36px; height: 36px; }
    .brand h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 18px; font-weight: 700; letter-spacing: 1.2px;
      background: linear-gradient(100deg, var(--accent), var(--cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .brand p { font-size: 11px; color: var(--muted); margin-top: 1px; letter-spacing: 0.3px; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      width: 38px; height: 38px; border-radius: 12px;
      background: var(--card); border: 1px solid var(--border);
      color: var(--muted); font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .icon-btn:hover, .icon-btn.active {
      border-color: var(--accent); color: var(--accent);
      background: rgba(124,252,0,0.08);
    }
    .live-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 8px var(--accent);
      display: none; animation: blink 1.4s infinite;
    }
    .live-dot.on { display: block; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.35} }

    /* ===== SEARCH ===== */
    .search-wrap { padding: 12px 14px 6px; flex-shrink: 0; }
    .search-bar {
      display: flex; gap: 8px; align-items: center;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 4px 4px 4px 14px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search-bar:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124,252,0,0.12);
    }
    .search-bar input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-size: 14px; font-family: inherit; padding: 10px 0;
    }
    .search-bar input::placeholder { color: var(--muted); }
    .search-bar button {
      background: linear-gradient(135deg, var(--accent), var(--accent-dim));
      border: none; border-radius: 11px; padding: 10px 16px;
      color: #081000; font-weight: 700; font-size: 13px; cursor: pointer;
      font-family: inherit;
    }

    /* ===== TABS (Browse / Favs / Recent) ===== */
    .tabs {
      display: flex; gap: 4px; padding: 8px 14px 4px; flex-shrink: 0;
    }
    .tab {
      flex: 1; text-align: center; padding: 9px 6px;
      font-size: 12px; font-weight: 600; color: var(--muted);
      background: transparent; border: none; border-radius: 10px;
      cursor: pointer; font-family: inherit; transition: all 0.15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active {
      background: rgba(124,252,0,0.1); color: var(--accent);
    }

    /* ===== FILTERS ===== */
    .filters {
      display: flex; gap: 6px; padding: 8px 14px 10px;
      overflow-x: auto; flex-shrink: 0;
      scrollbar-width: none; -ms-overflow-style: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0; padding: 7px 13px; border-radius: 20px;
      background: var(--card); border: 1px solid var(--border);
      color: var(--muted); font-size: 11.5px; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: all 0.12s; white-space: nowrap;
    }
    .chip:hover { border-color: var(--accent); color: var(--accent); }
    .chip.active {
      background: rgba(124,252,0,0.14); border-color: var(--accent);
      color: var(--accent); box-shadow: 0 0 12px rgba(124,252,0,0.15);
    }

    /* ===== META + ACTIONS ===== */
    .list-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 16px 8px; font-size: 11px; color: var(--muted); flex-shrink: 0;
    }
    .surprise-btn {
      background: transparent; border: 1px solid var(--border);
      color: var(--cyan); font-size: 11px; font-weight: 600;
      padding: 5px 10px; border-radius: 8px; cursor: pointer; font-family: inherit;
    }
    .surprise-btn:hover { border-color: var(--cyan); background: rgba(0,255,204,0.08); }

    /* ===== STATION LIST ===== */
    .list-wrap {
      flex: 1; overflow-y: auto; min-height: 0;
      margin: 0 10px; border-radius: 14px;
      border: 1px solid var(--border); background: var(--card);
      scrollbar-width: thin; scrollbar-color: #2a3344 transparent;
    }
    .station {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 12px; cursor: pointer;
      border-bottom: 1px solid rgba(30,37,51,0.8);
      transition: background 0.1s; position: relative;
    }
    .station:last-child { border-bottom: none; }
    .station:hover { background: rgba(124,252,0,0.05); }
    .station.playing {
      background: rgba(124,252,0,0.09);
      border-left: 3px solid var(--accent);
    }
    .fav-icon {
      width: 42px; height: 42px; border-radius: 11px;
      background: var(--elevated); object-fit: cover; flex-shrink: 0;
    }
    .fav-icon.ph {
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: var(--muted);
    }
    .st-info { flex: 1; min-width: 0; }
    .st-name {
      font-size: 13.5px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .st-meta {
      font-size: 11px; color: var(--muted); margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .st-actions { display: flex; align-items: center; gap: 4px; }
    .heart {
      width: 32px; height: 32px; border: none; background: transparent;
      color: var(--muted); font-size: 16px; cursor: pointer; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .heart:hover, .heart.on { color: #ff6b9d; }
    .heart.on { text-shadow: 0 0 8px rgba(255,107,157,0.5); }
    .play-ico {
      width: 28px; text-align: center; font-size: 15px; color: var(--accent);
      opacity: 0; transition: opacity 0.12s;
    }
    .station:hover .play-ico, .station.playing .play-ico { opacity: 1; }

    .empty, .loading, .err {
      text-align: center; padding: 50px 24px; color: var(--muted); font-size: 13px; line-height: 1.5;
    }
    .err { color: var(--danger); }
    .empty .big { font-size: 36px; margin-bottom: 10px; }

    .load-more {
      display: none; margin: 10px auto; padding: 9px 18px;
      background: var(--card); border: 1px solid var(--border);
      color: var(--accent); font-size: 12px; font-weight: 600;
      border-radius: 10px; cursor: pointer; font-family: inherit;
    }
    .load-more.show { display: block; }
    .load-more:hover { background: rgba(124,252,0,0.08); }

    /* ===== VISUALIZER + NOW PLAYING ===== */
    .player-bar {
      flex-shrink: 0;
      background: linear-gradient(180deg, transparent, rgba(124,252,0,0.03));
      border-top: 1px solid var(--border);
      padding: 10px 14px 14px;
      display: none;
    }
    .player-bar.show { display: block; }

    .viz-wrap {
      height: 36px; margin-bottom: 10px;
      border-radius: 8px; overflow: hidden;
      background: #070a10; border: 1px solid #151a24;
    }
    #viz { width: 100%; height: 100%; display: block; }

    .np {
      display: flex; align-items: center; gap: 12px;
    }
    .np-alien {
      width: 46px; height: 46px; border-radius: 50%;
      background: #0c160e; border: 2px solid var(--accent);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 16px var(--glow); flex-shrink: 0;
    }
    .np-alien svg { width: 30px; height: 30px; }
    .np-text { flex: 1; min-width: 0; }
    .np-label {
      font-size: 9px; font-weight: 700; color: var(--accent);
      letter-spacing: 1.2px; text-transform: uppercase;
    }
    .np-title {
      font-size: 14px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px;
    }
    .np-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .np-btns { display: flex; gap: 6px; align-items: center; }
    .np-btn {
      width: 38px; height: 38px; border-radius: 50%;
      border: 1px solid var(--border); background: var(--card);
      color: var(--text); font-size: 15px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.12s;
    }
    .np-btn:hover { border-color: var(--accent); color: var(--accent); }
    .np-btn.main {
      width: 46px; height: 46px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dim));
      border: none; color: #081000; font-size: 18px;
      box-shadow: 0 0 18px var(--glow);
    }
    .np-btn.heart-btn.on { color: #ff6b9d; border-color: #ff6b9d; }

    .controls-row {
      display: flex; align-items: center; gap: 10px; margin-top: 10px;
    }
    .vol-group { display: flex; align-items: center; gap: 8px; flex: 1; }
    .vol-group button {
      background: none; border: none; color: var(--muted); font-size: 15px; cursor: pointer; padding: 4px;
    }
    .vol-group button:hover { color: var(--accent); }
    .vol-group input[type=range] {
      flex: 1; -webkit-appearance: none; height: 4px;
      border-radius: 2px; background: #1a2130; outline: none;
    }
    .vol-group input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px;
      border-radius: 50%; background: var(--accent); cursor: pointer;
      box-shadow: 0 0 8px var(--glow);
    }
    .timer-btn {
      font-size: 11px; font-weight: 600; color: var(--muted);
      background: var(--card); border: 1px solid var(--border);
      padding: 6px 10px; border-radius: 8px; cursor: pointer; font-family: inherit;
    }
    .timer-btn.active { color: var(--purple); border-color: var(--purple); }

    .footer {
      text-align: center; font-size: 10px; color: var(--muted);
      padding: 8px 14px 12px; flex-shrink: 0;
    }
    .footer a { color: var(--accent); text-decoration: none; }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--elevated); border: 1px solid var(--border);
      color: var(--text); font-size: 13px; padding: 10px 18px;
      border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      opacity: 0; transition: all 0.3s; z-index: 100; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>

  <script>
    const API = [
      'https://de1.api.radio-browser.info',
      'https://nl1.api.radio-browser.info',
      'https://at1.api.radio-browser.info',
      'https://fr1.api.radio-browser.info'
    ];
    const LIMIT = 48;
    const LS_FAVS = 'airadio_favs_v1';
    const LS_RECENT = 'airadio_recent_v1';

    let stations = [];
    let current = null;
    let playing = false;
    let muted = false;
    let offset = 0;
    let query = { t: 'top' };
    let view = 'browse'; // browse | favs | recent
    let favs = JSON.parse(localStorage.getItem(LS_FAVS) || '[]');
    let recent = JSON.parse(localStorage.getItem(LS_RECENT) || '[]');
    let sleepTimer = null;
    let sleepLeft = 0;

    const audio = document.getElementById('audio');
    const listEl = document.getElementById('list');
    const countEl = document.getElementById('count');
    const moreBtn = document.getElementById('more');
    const playerBar = document.getElementById('playerBar');
    const npTitle = document.getElementById('npTitle');
    const npSub = document.getElementById('npSub');
    const npToggle = document.getElementById('npToggle');
    const npHeart = document.getElementById('npHeart');
    const liveDot = document.getElementById('liveDot');
    const vol = document.getElementById('vol');
    const muteBtn = document.getElementById('muteBtn');
    const timerBtn = document.getElementById('timerBtn');
    const qInput = document.getElementById('q');
    const vizCanvas = document.getElementById('viz');
    const vizCtx = vizCanvas.getContext('2d');
    let audioCtx, analyser, srcNode;

    async function api(path) {
      for (const base of API) {
        try {
          const r = await fetch(base + path, { headers: { 'User-Agent': 'AIRadio/3.0', Accept: 'application/json' } });
          if (r.ok) return await r.json();
        } catch (_) {}
      }
      throw new Error('offline');
    }

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    function isFav(uuid) { return favs.some(f => f.stationuuid === uuid); }

    function toggleFav(st) {
      if (!st) return;
      const i = favs.findIndex(f => f.stationuuid === st.stationuuid);
      if (i >= 0) {
        favs.splice(i, 1);
        toast('Removed from favorites');
      } else {
        favs.unshift({
          stationuuid: st.stationuuid,
          name: st.name,
          url: st.url_resolved || st.url,
          favicon: st.favicon,
          country: st.country,
          bitrate: st.bitrate,
          tags: st.tags,
          codec: st.codec
        });
        if (favs.length > 100) favs.pop();
        toast('Added to favorites ♥');
      }
      localStorage.setItem(LS_FAVS, JSON.stringify(favs));
      updateHearts();
      if (view === 'favs') renderList(favs);
    }

    function addRecent(st) {
      if (!st) return;
      recent = recent.filter(r => r.stationuuid !== st.stationuuid);
      recent.unshift({
        stationuuid: st.stationuuid,
        name: st.name,
        url: st.url_resolved || st.url,
        favicon: st.favicon,
        country: st.country,
        bitrate: st.bitrate,
        tags: st.tags,
        codec: st.codec
      });
      if (recent.length > 40) recent.pop();
      localStorage.setItem(LS_RECENT, JSON.stringify(recent));
    }

    function updateHearts() {
      document.querySelectorAll('.station').forEach((el, i) => {
        const st = stations[i];
        if (!st) return;
        const h = el.querySelector('.heart');
        if (h) {
          const on = isFav(st.stationuuid);
          h.classList.toggle('on', on);
          h.textContent = on ? '♥' : '♡';
        }
      });
      if (current) {
        const on = isFav(current.stationuuid);
        npHeart.classList.toggle('on', on);
        npHeart.textContent = on ? '♥' : '♡';
      }
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s || '';
      return d.innerHTML;
    }

    function renderList(arr, append = false) {
      if (!append) stations = arr;
      else stations = stations.concat(arr);

      if (!stations.length) {
        const msg = view === 'favs'
          ? '<div class="empty"><div class="big">♡</div>No favorites yet.<br>Tap the heart on any station.</div>'
          : view === 'recent'
          ? '<div class="empty"><div class="big">🕑</div>Nothing played yet.<br>Start listening!</div>'
          : '<div class="empty"><div class="big">👽</div>No stations in this sector.<br>Try another filter.</div>';
        listEl.innerHTML = msg;
        countEl.textContent = '0 stations';
        moreBtn.classList.remove('show');
        return;
      }

      listEl.innerHTML = stations.map((s, i) => {
        const fav = s.favicon && String(s.favicon).startsWith('http')
          ? `<img class="fav-icon" src="${s.favicon}" loading="lazy" onerror="this.outerHTML='<div class=\\'fav-icon ph\\'>👽</div>'"/>`
          : `<div class="fav-icon ph">👽</div>`;
        const tags = (s.tags || '').split(',').filter(Boolean).slice(0, 2).join(', ');
        const meta = [s.country, s.bitrate ? s.bitrate + ' kbps' : '', tags].filter(Boolean).join(' · ');
        const on = current && current.stationuuid === s.stationuuid;
        const heartOn = isFav(s.stationuuid);
        return `<div class="station ${on ? 'playing' : ''}" data-i="${i}">
          ${fav}
          <div class="st-info">
            <div class="st-name">${esc(s.name)}</div>
            <div class="st-meta">${esc(meta)}</div>
          </div>
          <div class="st-actions">
            <button class="heart ${heartOn ? 'on' : ''}" data-fav="${i}">${heartOn ? '♥' : '♡'}</button>
            <span class="play-ico">${on && playing ? '⏸' : '▶'}</span>
          </div>
        </div>`;
      }).join('');

      countEl.textContent = `${stations.length} station${stations.length !== 1 ? 's' : ''}`;
      moreBtn.classList.toggle('show', view === 'browse' && arr.length >= LIMIT);
    }

    function path(q, off) {
      if (q.t === 'top') return `/json/stations/topvote/${LIMIT}?offset=${off}&hidebroken=true`;
      if (q.t === 'clicks') return `/json/stations/topclick/${LIMIT}?offset=${off}&hidebroken=true`;
      if (q.t === 'search') return `/json/stations/search?name=${encodeURIComponent(q.v)}&limit=${LIMIT}&offset=${off}&hidebroken=true&order=votes&reverse=true`;
      if (q.t === 'tag') return `/json/stations/search?tag=${encodeURIComponent(q.v)}&limit=${LIMIT}&offset=${off}&hidebroken=true&order=votes&reverse=true`;
      if (q.t === 'country') return `/json/stations/search?country=${encodeURIComponent(q.v)}&limit=${LIMIT}&offset=${off}&hidebroken=true&order=votes&reverse=true`;
      if (q.t === 'language') return `/json/stations/search?language=${encodeURIComponent(q.v)}&limit=${LIMIT}&offset=${off}&hidebroken=true&order=votes&reverse=true`;
      return `/json/stations/topvote/${LIMIT}?offset=${off}&hidebroken=true`;
    }

    async function load(q, append = false) {
      if (view !== 'browse') return;
      if (!append) {
        listEl.innerHTML = '<div class="loading">Scanning the airwaves…</div>';
        offset = 0;
        query = q;
      }
      try {
        const data = await api(path(q, offset));
        const valid = data.filter(s => s.url_resolved || s.url);
        renderList(valid, append);
        offset += LIMIT;
      } catch {
        if (!append) {
          listEl.innerHTML = '<div class="err">Transmission failed. Check your connection.</div>';
          countEl.textContent = 'Error';
        }
      }
    }

    function initAudioGraph() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 128;
      analyser.smoothingTimeConstant = 0.75;
      srcNode = audioCtx.createMediaElementSource(audio);
      srcNode.connect(analyser);
      analyser.connect(audioCtx.destination);
    }

    function drawViz() {
      requestAnimationFrame(drawViz);
      if (!analyser || !playing) {
        const w = vizCanvas.width / (devicePixelRatio || 1);
        const h = vizCanvas.height / (devicePixelRatio || 1);
        vizCtx.fillStyle = '#070a10';
        vizCtx.fillRect(0, 0, w, h);
        return;
      }
      const buf = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(buf);
      const w = vizCanvas.width / (devicePixelRatio || 1);
      const h = vizCanvas.height / (devicePixelRatio || 1);
      vizCtx.fillStyle = 'rgba(7,10,16,0.35)';
      vizCtx.fillRect(0, 0, w, h);
      const n = Math.floor(buf.length * 0.7);
      const bw = w / n;
      for (let i = 0; i < n; i++) {
        const bh = (buf[i] / 255) * h * 0.92;
        const hue = 90 + (buf[i] / 255) * 50;
        vizCtx.fillStyle = `hsla(${hue}, 95%, 55%, 0.9)`;
        vizCtx.fillRect(i * bw, h - bh, bw - 1.5, bh);
      }
    }

    function resizeViz() {
      const r = vizCanvas.parentElement.getBoundingClientRect();
      const dpr = devicePixelRatio || 1;
      vizCanvas.width = r.width * dpr;
      vizCanvas.height = r.height * dpr;
      vizCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function play(st) {
      if (!st) return;
      const url = st.url_resolved || st.url;
      if (!url) return;
      current = st;
      addRecent(st);
      audio.src = url;
      audio.volume = muted ? 0 : vol.value / 100;
      initAudioGraph();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      audio.play().then(() => {
        playing = true;
        updatePlayer();
      }).catch(() => {
        playing = false;
        npTitle.textContent = st.name;
        npSub.textContent = 'Stream offline or blocked — try another';
        playerBar.classList.add('show');
        updatePlayer();
      });
    }

    function updatePlayer() {
      if (!current) return;
      playerBar.classList.add('show');
      liveDot.classList.toggle('on', playing);
      npTitle.textContent = current.name || 'Unknown';
      npSub.textContent = [current.country, current.bitrate ? current.bitrate + ' kbps' : '', current.codec]
        .filter(Boolean).join(' · ') || 'Internet stream';
      npToggle.textContent = playing ? '⏸' : '▶';
      const on = isFav(current.stationuuid);
      npHeart.classList.toggle('on', on);
      npHeart.textContent = on ? '♥' : '♡';
      document.querySelectorAll('.station').forEach((el, i) => {
        const s = stations[i];
        const match = s && current && s.stationuuid === current.stationuuid;
        el.classList.toggle('playing', match);
        const ico = el.querySelector('.play-ico');
        if (ico) ico.textContent = match && playing ? '⏸' : '▶';
      });
      resizeViz();
    }

    function toggle() {
      if (!current) return;
      if (playing) { audio.pause(); playing = false; }
      else { audio.play().then(() => { playing = true; }).catch(() => {}); }
      updatePlayer();
    }

    function stop() {
      audio.pause();
      audio.removeAttribute('src');
      playing = false;
      current = null;
      playerBar.classList.remove('show');
      liveDot.classList.remove('on');
      document.querySelectorAll('.station').forEach(el => {
        el.classList.remove('playing');
        const ico = el.querySelector('.play-ico');
        if (ico) ico.textContent = '▶';
      });
      clearSleep();
    }

    function setView(v) {
      view = v;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === v));
      document.getElementById('filters').style.display = v === 'browse' ? 'flex' : 'none';
      moreBtn.classList.remove('show');
      if (v === 'browse') load(query);
      else if (v === 'favs') renderList(favs);
      else renderList(recent);
    }

    // Sleep timer
    function clearSleep() {
      if (sleepTimer) clearInterval(sleepTimer);
      sleepTimer = null;
      sleepLeft = 0;
      timerBtn.textContent = '⏱ Sleep';
      timerBtn.classList.remove('active');
    }
    function startSleep(mins) {
      clearSleep();
      sleepLeft = mins * 60;
      timerBtn.classList.add('active');
      timerBtn.textContent = `⏱ ${mins}m`;
      sleepTimer = setInterval(() => {
        sleepLeft--;
        if (sleepLeft <= 0) {
          stop();
          toast('Sleep timer ended');
          clearSleep();
          return;
        }
        const m = Math.ceil(sleepLeft / 60);
        timerBtn.textContent = `⏱ ${m}m`;
      }, 1000);
      toast(`Sleep timer: ${mins} minutes`);
    }

    // Events
    document.getElementById('searchBtn').onclick = () => {
      const v = qInput.value.trim();
      if (v) { setView('browse'); load({ t: 'search', v }); document.querySelectorAll('.chip').forEach(c => c.classList.remove('active')); }
      else load({ t: 'top' });
    };
    qInput.onkeydown = e => { if (e.key === 'Enter') document.getElementById('searchBtn').click(); };

    document.querySelectorAll('.tab').forEach(t => t.onclick = () => setView(t.dataset.view));

    document.getElementById('filters').onclick = e => {
      const c = e.target.closest('.chip');
      if (!c) return;
      document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
      c.classList.add('active');
      qInput.value = '';
      const t = c.dataset.t, v = c.dataset.v;
      load(t === 'top' || t === 'clicks' ? { t } : { t, v });
    };

    listEl.onclick = e => {
      const heart = e.target.closest('.heart');
      if (heart) {
        e.stopPropagation();
        const i = +heart.dataset.fav;
        toggleFav(stations[i]);
        return;
      }
      const row = e.target.closest('.station');
      if (!row) return;
      const i = +row.dataset.i;
      const s = stations[i];
      if (current && current.stationuuid === s.stationuuid) toggle();
      else play(s);
    };

    moreBtn.onclick = () => load(query, true);
    npToggle.onclick = toggle;
    document.getElementById('npStop').onclick = stop;
    npHeart.onclick = () => toggleFav(current);

    vol.oninput = () => {
      if (!muted) audio.volume = vol.value / 100;
    };
    muteBtn.onclick = () => {
      muted = !muted;
      audio.volume = muted ? 0 : vol.value / 100;
      muteBtn.textContent = muted ? '🔇' : '🔊';
    };

    timerBtn.onclick = () => {
      if (sleepTimer) { clearSleep(); toast('Sleep timer cancelled'); return; }
      // cycle 15 → 30 → 45 → 60
      const opts = [15, 30, 45, 60];
      const cur = parseInt(timerBtn.dataset.next || '0', 10);
      const mins = opts[cur % opts.length];
      timerBtn.dataset.next = (cur + 1) % opts.length;
      startSleep(mins);
    };

    document.getElementById('surprise').onclick = async () => {
      setView('browse');
      listEl.innerHTML = '<div class="loading">Finding a random signal…</div>';
      try {
        // random from top 500
        const data = await api('/json/stations/topvote/100?hidebroken=true');
        const valid = data.filter(s => s.url_resolved || s.url);
        if (valid.length) {
          const pick = valid[Math.floor(Math.random() * valid.length)];
          renderList(valid.slice(0, 48));
          play(pick);
          toast('🎲 Surprised!');
        }
      } catch {
        listEl.innerHTML = '<div class="err">Could not fetch stations.</div>';
      }
    };

    // Keyboard
    document.addEventListener('keydown', e => {
      if (e.target.matches('input')) return;
      if (e.code === 'Space') { e.preventDefault(); toggle(); }
      if (e.key === 'm' || e.key === 'M') muteBtn.click();
    });

    audio.addEventListener('ended', () => { playing = false; updatePlayer(); });
    audio.addEventListener('error', () => {
      if (current) {
        npSub.textContent = 'Stream error — try another station';
        playing = false;
        updatePlayer();
      }
    });

    window.addEventListener('resize', resizeViz);
    resizeViz();
    drawViz();
    load({ t: 'top' });
  </script>
</body>
</html>
